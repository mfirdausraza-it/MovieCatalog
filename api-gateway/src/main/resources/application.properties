server.port=9000

spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=movie-catalog
spring.cloud.gateway.routes[0].uri=lb://movie-catalog-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/catalog/**


logging.pattern.console=%d{HH:mm:ss} %-5level [${spring.application.name}] %msg%n
